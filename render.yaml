services:
  - type: web
    name: qa-agent-hub-backend
    runtime: python
    rootDir: backend
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /
